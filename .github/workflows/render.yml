name: 🎬 Cloud Video Renderer

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Select render target'
        required: true
        default: 'apni_dukaan_anime'
        type: choice
        options:
          - 'apni_dukaan_anime'
          - 'latest'
          - 'all'
          - 'shop_avatar_ad'
          - 'bastar_yash_ad'
      custom_project:
        description: 'Or enter exact project folder name in video_output/'
        required: false
        default: ''
        type: string
  push:
    paths:
      - 'video_output/**'
      - '.github/workflows/render.yml'
      - 'scripts/**'
      - 'brandkit/**'
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    name: ⚡ Render Video in Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Install Root & Project Dependencies
        run: |
          npm install
          for d in video_output/*/code; do
            if [ -f "$d/package.json" ]; then
              echo "Installing in $d..."
              (cd "$d" && npm install --prefer-offline --no-audit) || true
            fi
          done

      - name: 🎞️ Install FFmpeg & System Display Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 fonts-noto-color-emoji fonts-dejavu fonts-freefont-ttf || true
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2 || true

      - name: 🎬 Run Cloud Video Render
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          CUSTOM_PROJ: ${{ github.event.inputs.custom_project }}
        run: |
          TARGET="${CUSTOM_PROJ:-$INPUT_TARGET}"
          if [ -z "$TARGET" ]; then
            TARGET="apni_dukaan_anime"
          fi
          echo "Executing Render for Target: $TARGET"
          python scripts/cloud_render.py --target "$TARGET"

      - name: 📤 Upload Rendered Videos as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-rendered-video
          path: |
            exports/*.mp4
            video_output/**/output/*.mp4
          if-no-files-found: warn
          retention-days: 14

      - name: 🚀 Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest-video
          name: "🎬 Latest Master Video Render"
          body: "Rendered via GitHub Actions Cloud Runners for shop LifeSolveNow."
          files: |
            exports/*.mp4
            video_output/**/output/*.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
