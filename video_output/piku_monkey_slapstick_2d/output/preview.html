<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIKU THE MONKEY VS CLUMSY PREDATORS — 100% Crystal-Clear Cartoon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #040810;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px 10px;
    }
    header {
      text-align: center;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(90deg, #F59E0B, #10B981, #38BDF8, #EC4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    header p {
      color: #94A3B8;
      font-size: 13px;
      margin-top: 4px;
    }

    /* 9:16 Vertical Reel Player */
    .reel-container {
      position: relative;
      width: 420px;
      height: 746px; /* 9:16 aspect ratio */
      background: #0c1c14;
      border-radius: 28px;
      box-shadow: 0 0 60px rgba(16, 185, 129, 0.25), 0 25px 60px rgba(0,0,0,0.9);
      border: 3px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Jungle Background */
    .jungle-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 20%, rgba(245, 158, 11, 0.2) 0%, transparent 60%),
        linear-gradient(180deg, #062b1a 0%, #0d4a2b 45%, #051a10 85%, #020b07 100%);
      z-index: 1;
    }
    .sunbeams {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(60deg, transparent, transparent 35px, rgba(255, 235, 150, 0.04) 35px, rgba(255, 235, 150, 0.04) 70px);
      z-index: 2;
      pointer-events: none;
    }

    /* Top Scene Indicator */
    .scene-badge {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #F59E0B;
      color: #F59E0B;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 18px;
      border-radius: 20px;
      letter-spacing: 1px;
      text-transform: uppercase;
      z-index: 20;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }

    /* Comic Popups */
    .comic-popup {
      position: absolute;
      font-weight: 900;
      font-size: 22px;
      padding: 8px 18px;
      border-radius: 14px;
      text-transform: uppercase;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.2) rotate(-10deg);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .comic-popup.show {
      opacity: 1;
      transform: scale(1.1) rotate(-4deg);
    }
    .popup-catapult {
      top: 180px;
      left: 30px;
      background: #EF4444;
      color: #FFF;
      box-shadow: 0 0 35px #EF4444;
      border: 3px solid #FFF;
    }
    .popup-beehive {
      top: 240px;
      right: 30px;
      background: #F59E0B;
      color: #000;
      box-shadow: 0 0 35px #F59E0B;
      border: 3px solid #FFF;
    }
    .popup-slip {
      top: 320px;
      left: 50%;
      transform: translateX(-50%) scale(0.2);
      background: #10B981;
      color: #FFF;
      box-shadow: 0 0 35px #10B981;
      border: 3px solid #FFF;
    }
    .popup-slip.show {
      transform: translateX(-50%) scale(1.15) rotate(4deg);
    }
    .popup-splash {
      top: 260px;
      left: 50%;
      transform: translateX(-50%) scale(0.2);
      background: linear-gradient(45deg, #06B6D4, #3B82F6);
      color: #FFF;
      font-size: 32px;
      box-shadow: 0 0 50px #06B6D4;
      border: 3px solid #FFF;
    }
    .popup-splash.show {
      transform: translateX(-50%) scale(1.2) rotate(-3deg);
    }

    /* Characters Stage */
    .stage {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 140px;
    }

    /* Piku Monkey (Top/Hero) */
    .piku-wrapper {
      position: absolute;
      top: 100px;
      right: 25px;
      width: 170px;
      height: 230px;
      transition: transform 0.25s;
    }
    .piku-wrapper.active-speaking {
      transform: scale(1.1) translateY(-6px);
      filter: drop-shadow(0 0 30px rgba(245, 158, 11, 0.7));
    }

    /* Predators Area (Bottom/Clumsy) */
    .predators-wrapper {
      position: absolute;
      bottom: 145px;
      left: 20px;
      right: 20px;
      height: 320px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .fighter {
      transition: transform 0.25s, filter 0.25s;
    }
    .fighter.active-speaking {
      transform: scale(1.1);
      filter: drop-shadow(0 0 25px rgba(239, 68, 68, 0.7));
    }
    .fighter.shake {
      animation: predatorShake 0.35s infinite;
    }
    @keyframes predatorShake {
      0%, 100% { transform: translateY(0) rotate(0); }
      25% { transform: translateY(-12px) rotate(-6deg); }
      75% { transform: translateY(8px) rotate(6deg); }
    }

    /* Flying Catapult Animation */
    .predators-wrapper.catapult-flight {
      animation: launchSky 1.5s forwards;
    }
    @keyframes launchSky {
      0% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-400px) scale(0.6) rotate(180deg); }
      80% { transform: translateY(-600px) scale(0.3) rotate(360deg); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Subtitles Box */
    .caption-box {
      position: absolute;
      bottom: 20px;
      left: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 18px;
      padding: 12px 16px;
      text-align: center;
      z-index: 25;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .speaker-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .caption-text {
      font-size: 15px;
      font-weight: 700;
      color: #F8FAFC;
      line-height: 1.35;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 420px;
      margin-top: 14px;
      gap: 10px;
    }
    .btn-main {
      background: linear-gradient(90deg, #10B981, #06B6D4);
      color: #000;
      font-weight: 900;
      font-size: 16px;
      padding: 13px 26px;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
    }
    .quick-jumps {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .btn-jump {
      flex: 1;
      background: #1E293B;
      color: #94A3B8;
      font-size: 11px;
      font-weight: 700;
      padding: 8px 0;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .btn-jump:hover {
      background: #334155;
      color: #FFF;
    }
  </style>
</head>
<body>

  <header>

      <!-- Predators Group (Chitu Leopard & Bhalu Bear) -->
      <div class="predators-wrapper" id="predatorsWrapper">
        <!-- Chitu (Leopard) -->
        <div class="fighter" id="chituFighter">
          <svg width="180" height="250" viewBox="0 0 300 400" fill="none">
            <!-- Spotted Body -->
            <ellipse cx="150" cy="270" rx="60" ry="75" fill="#FBBF24" stroke="#B45309" stroke-width="3" />
            <!-- Spots -->
            <circle cx="130" cy="240" r="7" fill="#78350F" />
            <circle cx="170" cy="250" r="8" fill="#78350F" />

            <!-- Leopard Head -->
            <g id="chituHead" transform="translate(150, 160)">
              <!-- Ears -->
              <polygon points="-40,-15 -25,-55 -10,-20" fill="#FBBF24" stroke="#B45309" stroke-width="3" />
              <polygon points="10,-20 25,-55 40,-15" fill="#FBBF24" stroke="#B45309" stroke-width="3" />

              <circle cx="0" cy="0" r="45" fill="#FBBF24" stroke="#B45309" stroke-width="3" />

              <ellipse cx="15" cy="8" rx="18" ry="18" fill="#FEF3C7" />

              <!-- Whiskers -->
              <line x1="-25" y1="12" x2="-60" y2="8" stroke="#1E293B" stroke-width="2" />
              <line x1="-25" y1="18" x2="-60" y2="22" stroke="#1E293B" stroke-width="2" />
              <line x1="25" y1="12" x2="60" y2="8" stroke="#1E293B" stroke-width="2" />

              <circle cx="-16" cy="-8" r="11" fill="#FEF08A" stroke="#78350F" stroke-width="2" />
              <circle cx="-16" cy="-8" r="5" fill="#18181B" id="chituPupilL" />
              <circle cx="16" cy="-8" r="11" fill="#FEF08A" stroke="#78350F" stroke-width="2" />
              <circle cx="16" cy="-8" r="5" fill="#18181B" id="chituPupilR" />

              <!-- Nose -->
              <polygon points="-6,6 6,6 0,13" fill="#DC2626" />

              <!-- Tongue & Mouth -->
              <g id="chituMouth" transform="translate(0, 22)">

        <!-- Bhalu (Bear) -->

              <g id="beehiveGroup" style="opacity: 0; transition: opacity 0.3s;" transform="translate(0, -60)">

    <!-- Subtitles / Dialogue Caption Box -->

  <audio id="slapstickAudio" src="../audio/voiceover.mp3"></audio>

  <div class="controls">
    <button class="btn-main" id="playBtn" onclick="togglePlay()">▶ PLAY CRYSTAL-CLEAR CARTOON VIDEO</button>
    <div class="quick-jumps">
      <button class="btn-jump" onclick="jumpTo(0)">0s Mango Bait</button>
      <button class="btn-jump" onclick="jumpTo(9.5)">9s Catapult</button>
      <button class="btn-jump" onclick="jumpTo(19.2)">19s Beehive</button>
      <button class="btn-jump" onclick="jumpTo(27.4)">27s Banana Slip</button>
      <button class="btn-jump" onclick="jumpTo(36.0)">36s Splash Win</button>
    </div>
  </div>

  <script>
    const audio = document.getElementById('slapstickAudio');
    const playBtn = document.getElementById('playBtn');
    const sceneBadge = document.getElementById('sceneBadge');
    const speakerTag = document.getElementById('speakerTag');
    const captionText = document.getElementById('captionText');

    const pikuWrapper = document.getElementById('pikuWrapper');
    const predatorsWrapper = document.getElementById('predatorsWrapper');
    const chituFighter = document.getElementById('chituFighter');
    const bhaluFighter = document.getElementById('bhaluFighter');
    const beehiveGroup = document.getElementById('beehiveGroup');

    const pikuMouth = document.getElementById('pikuMouth');
    const chituMouth = document.getElementById('chituMouth');
    const bhaluMouth = document.getElementById('bhaluMouth');

    const popupCatapult = document.getElementById('popupCatapult');
    const popupBeehive = document.getElementById('popupBeehive');
    const popupSlip = document.getElementById('popupSlip');
    const popupSplash = document.getElementById('popupSplash');

    let timeline = [];
    let visemesData = null;
    let animId = null;

    fetch('../audio/timeline_cues.json').then(r => r.json()).then(d => timeline = d);
    fetch('../audio/visemes.json').then(r => r.json()).then(d => visemesData = d);

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '⏸ PAUSE VIDEO';
        playBtn.style.background = '#475569';
        playBtn.style.color = '#FFF';
        startLoop();
      } else {
        audio.pause();
        playBtn.textContent = '▶ PLAY CRYSTAL-CLEAR CARTOON VIDEO';
        playBtn.style.background = 'linear-gradient(90deg, #10B981, #06B6D4)';
        playBtn.style.color = '#000';
        if (animId) cancelAnimationFrame(animId);
      }
    }

    function jumpTo(sec) {
      audio.currentTime = sec;
      if (audio.paused) togglePlay();
    }

    function startLoop() {
      function loop() {
        if (!audio.paused) {
          update(audio.currentTime);
          animId = requestAnimationFrame(loop);
        }
      }
      animId = requestAnimationFrame(loop);
    }

    function update(t) {
      const f = Math.floor(t * 30);
      const curCue = timeline.find(c => t >= c.start && t < c.end) || timeline[0];

      if (curCue) {
        captionText.textContent = curCue.text;
        pikuWrapper.classList.remove('active-speaking');
        chituFighter.classList.remove('active-speaking');
        bhaluFighter.classList.remove('active-speaking');

        if (curCue.speaker === 'piku') {
          speakerTag.textContent = '🐵 Piku (Baby Monkey)';
          speakerTag.style.color = '#F59E0B';
          pikuWrapper.classList.add('active-speaking');
        } else if (curCue.speaker === 'chitu') {
          speakerTag.textContent = '🐆 Chitu (Overconfident Leopard)';
          speakerTag.style.color = '#FBBF24';
          chituFighter.classList.add('active-speaking');
        } else if (curCue.speaker === 'bhalu') {
          speakerTag.textContent = '🐻 Bhalu (Clumsy Bear)';
          speakerTag.style.color = '#B45309';
          bhaluFighter.classList.add('active-speaking');
        } else if (curCue.speaker === 'both') {
          speakerTag.textContent = '😱 Predators In Distress!';
          speakerTag.style.color = '#EF4444';
          chituFighter.classList.add('active-speaking');
          bhaluFighter.classList.add('active-speaking');
        }
      }

      // Scene timeline states
      if (t < 9.5) {
        sceneBadge.textContent = 'SCENE 1: THE SWEET GOLDEN MANGO';
        popupCatapult.classList.remove('show');
        popupBeehive.classList.remove('show');
        popupSlip.classList.remove('show');
        popupSplash.classList.remove('show');
        beehiveGroup.style.opacity = '0';
        predatorsWrapper.classList.remove('catapult-flight');
      } else if (t >= 9.5 && t < 19.2) {
        sceneBadge.textContent = 'SCENE 2: THE BAMBOO CATAPULT!';
        popupCatapult.classList.add('show');
        popupBeehive.classList.remove('show');
        if (t >= 9.5 && t <= 12.0) {
          predatorsWrapper.classList.add('catapult-flight');
        } else {
          predatorsWrapper.classList.remove('catapult-flight');
        }
      } else if (t >= 19.2 && t < 27.4) {
        sceneBadge.textContent = 'SCENE 3: THE BEEHIVE HELMET!';
        popupCatapult.classList.remove('show');
        popupBeehive.classList.add('show');
        beehiveGroup.style.opacity = '1';
        bhaluFighter.classList.add('shake');
      } else if (t >= 27.4 && t < 36.0) {
        sceneBadge.textContent = 'SCENE 4: BANANA PEEL CRASH!';
        popupBeehive.classList.remove('show');
        popupSlip.classList.add('show');
        chituFighter.classList.add('shake');
      } else {
        sceneBadge.textContent = 'SCENE 5: RIVER SPLASH & PIKU WINS!';
        popupSlip.classList.remove('show');
        popupSplash.classList.add('show');
        bhaluFighter.classList.remove('shake');
        chituFighter.classList.remove('shake');
      }

      // Visemes Lip-Sync
      if (visemesData && visemesData.frames && visemesData.frames[f]) {
        const shape = visemesData.frames[f].mouth;
        if (curCue && curCue.speaker === 'piku') {
          if (shape === 'open_wide') pikuMouth.innerHTML = '<ellipse cx="0" cy="0" rx="14" ry="12" fill="#7F1D1D" stroke="#451A03" stroke-width="2" /><rect x="-8" y="-6" width="16" height="3" fill="#FFF" />';
          else if (shape === 'open_small') pikuMouth.innerHTML = '<ellipse cx="0" cy="0" rx="12" ry="8" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />';
          else pikuMouth.innerHTML = '<ellipse cx="0" cy="0" rx="10" ry="4" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />';
        } else {
          pikuMouth.innerHTML = '<ellipse cx="0" cy="0" rx="9" ry="4" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />';
        }

        if (curCue && (curCue.speaker === 'chitu' || curCue.speaker === 'both')) {
          chituMouth.innerHTML = (shape === 'open_wide') ? '<ellipse cx="0" cy="0" rx="18" ry="14" fill="#7F1D1D" stroke="#78350F" stroke-width="2" /><path d="M -4 4 C -4 20, 4 20, 4 4 Z" fill="#F43F5E" />' : '<ellipse cx="0" cy="0" rx="12" ry="6" fill="#7F1D1D" stroke="#78350F" stroke-width="2" />';
        } else {
          chituMouth.innerHTML = '<ellipse cx="0" cy="0" rx="10" ry="5" fill="#7F1D1D" stroke="#78350F" stroke-width="2" />';
        }

        if (curCue && (curCue.speaker === 'bhalu' || curCue.speaker === 'both')) {
          bhaluMouth.innerHTML = (shape === 'open_wide') ? '<ellipse cx="0" cy="0" rx="20" ry="16" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />' : '<ellipse cx="0" cy="0" rx="14" ry="7" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />';
        } else {
          bhaluMouth.innerHTML = '<ellipse cx="0" cy="0" rx="12" ry="5" fill="#7F1D1D" stroke="#451A03" stroke-width="2" />';
        }
      }

      if (audio.ended) {
        playBtn.textContent = '🔁 REPLAY CARTOON VIDEO';
        playBtn.style.background = 'linear-gradient(90deg, #10B981, #06B6D4)';
        playBtn.style.color = '#000';
      }
    }
  </script>
</body>
</html>
